<style>
:root{--fg:#c9d1c8;--dim:#6f7a70;--accent:#9fb8a4;--warn:#c25a4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--fg);font-family:"Yu Gothic","YuGothic","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;gap:18px;background:#000;transition:opacity 1.2s}
.hidden{opacity:0;pointer-events:none}
h1{font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;font-weight:500;font-size:clamp(28px,7vw,44px);letter-spacing:.12em}
.lead{line-height:2;font-size:15px;color:var(--fg)}
.notes{list-style:none;font-size:12px;color:var(--dim);line-height:1.9}
.primary{border:1px solid #3c463e;background:#0b0e0c;padding:12px 34px;letter-spacing:.2em;font-size:15px;border-radius:2px;transition:background .3s}
.primary:hover,.primary:focus-visible{background:#18201b;outline:none}
.small{font-size:11px;color:var(--dim)}

#game{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(100vw - 32px,760px)}
#monitor{position:relative;width:100%;aspect-ratio:4/3;max-height:calc(100vh - 190px);background:#000;border:10px solid #111311;border-radius:14px;box-shadow:0 0 0 1px #222,0 0 60px rgba(120,150,130,.06);overflow:hidden}
#c{width:100%;height:100%;display:block;filter:blur(.35px) contrast(1.08)}
#crack{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.osd{position:absolute;font-family:"MS Gothic","Osaka-Mono",monospace;font-size:clamp(10px,2.3vw,15px);color:#e4ebe2;text-shadow:0 0 3px rgba(0,0,0,.9);letter-spacing:.06em;pointer-events:none;white-space:nowrap}
#osd-cam{top:4%;left:4%}
#osd-rec{top:4%;right:4%}
#osd-rec i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#c33;margin-right:.4em;vertical-align:.05em}
#osd-time{bottom:4%;left:4%}
#osd-status{top:11%;right:4%;font-size:clamp(9px,2vw,13px);color:#b8c4b7}
#osd-status.bad{color:#d0705f}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s;display:flex;align-items:center;justify-content:center}
.nosig{font-family:"MS Gothic","Osaka-Mono",monospace;color:#8fa596;font-size:clamp(14px,3.4vw,22px);letter-spacing:.3em}
#monitor{will-change:transform}
#sub{min-height:3.6em;font-size:clamp(13px,3.6vw,16px);line-height:1.8;color:var(--fg);text-align:center;padding:0 8px}
#sub .who{color:var(--accent);font-size:.85em;margin-right:.4em}
#sub.inner{color:#d9c9c3;font-style:italic}
#report{width:min(100%,320px);padding:14px 0;font-size:17px;letter-spacing:.5em;text-indent:.5em;background:#140c0b;border:1px solid #4a2a25;color:#e7c9c2;border-radius:3px;transition:transform .08s,background .2s}
#report:active{transform:scale(.97);background:#251412}

#share{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:420px}

<body>


<section id="title" class="screen">
  <h1>4階、異常なし。</h1>
  <p class="lead">深夜の警備アルバイト。<br>交代まで、あと少し。<br>モニターに異常があれば［報告］を押してください。<br>それだけです。</p>
  <ul class="notes">
    <li>プレイ時間 約45秒 ／ ヘッドホン推奨</li>
    <li>大きな音や、急に驚かせる演出はありません</li>
    <li>映像が乱れる演出があります（激しい点滅はありません）</li>
  </ul>
  <p class="small" id="badge"></p>
  <button class="primary" id="start">勤務につく</button>
  <p class="small">操作：［報告］ボタン（PCはスペースキーでも可）</p>
</section>

<div id="game" class="hidden" aria-hidden="true">
  <div id="monitor">
    <canvas id="c" width="320" height="240"></canvas>
    <div id="scan"></div>
    <canvas id="crack"></canvas>
    <div class="osd" id="osd-cam">CAM 03　4F 東廊下</div>
    <div class="osd" id="osd-rec"><i></i>REC</div>
    <div class="osd" id="osd-status"></div>
    <div class="osd" id="osd-time"></div>
    <div id="fade"></div>
  </div>

</div>

<section id="ending" class="screen hidden" aria-live="polite">

  <p class="line" data-d="2400" id="end-text"></p>

  <p class="line" data-d="3600" id="end-chain"></p>
  <p class="line" data-d="4800" id="end-hand">このモニターは、次の人に引き継いでください。</p>
  <div class="line" data-d="5800" id="share">
    <a class="x" id="share-x" target="_blank" rel="noopener">Xで引き継ぐ</a>
    <button id="share-native" hidden>共有</button>
    <button id="share-copy">リンクをコピー</button>
    <button id="again">もう一度、勤務につく</button>
  </div>
  <p class="line" data-d="5800" id="toast"></p>
</section>

<noscript><p style="padding:20px">JavaScriptを有効にしてください。</p></noscript>

<script>
'use strict';
/* ===== 設定 ===== */
const W = 320, H = 240;
/* ===== 引き継ぎ（シェアの連鎖） =====
   リンクの ?k= に「何人目か」と、今の周回の前任者の記録（時:分・見逃し件数）を入れる。
   推測で番号を飛ばされないよう、簡単な撹拌とチェックサムをかけている。 */
const CYCLE = 9;
const KEY = [0x5a, 0x13, 0xc7, 0x2e, 0x91, 0x44, 0xb8, 0x0d];
function encChain(o){
  const str = o.n + '|' + o.log.map(r => r.join(',')).join(';');
  const b = Array.from(new TextEncoder().encode(str));
  let sum = 0;
  const x = b.map((v, i) => { sum = (sum + v * (i + 1)) % 251; return v ^ KEY[i % 8] ^ ((i * 37) & 255); });
  x.push(sum);
  return btoa(String.fromCharCode.apply(null, x)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decChain(k){
  try {
    if (!k) return null;
    let b64 = k.replace(/-/g, '+').replace(/_/g, '/'); while (b64.length % 4) b64 += '=';
    const x = Array.from(atob(b64), c => c.charCodeAt(0)), sum = x.pop();
    let cs = 0;
    const b = x.map((v, i) => { const o = v ^ KEY[i % 8] ^ ((i * 37) & 255); cs = (cs + o * (i + 1)) % 251; return o; });
    if (cs !== sum) return null;
    const [n, logs] = new TextDecoder().decode(new Uint8Array(b)).split('|');
    const N = parseInt(n, 10); if (!(N >= 1 && N < 1e6)) return null;
    const log = logs ? logs.split(';').map(r => r.split(',').map(Number)).filter(r => r.length === 3 && r.every(Number.isFinite)).slice(-(CYCLE - 1)) : [];
    return { n: N, log };
  } catch(e){ return null; }
}
const chain = decChain(new URLSearchParams(location.search).get('k')) || { n: 1, log: [] };
const POS = (chain.n - 1) % CYCLE + 1;   // 周回の中で何人目か
const LAST = POS === CYCLE;              // 9人目：交代が来ない

/* ===== 時間割（秒）：毎回ランダム。通常版はおよそ45〜60秒、9人目はおよそ55〜60秒 ===== */
let ROOM_AT, LAST_ROOM_AT, END_AT, TURN_AT;   // 警備室へ切り替わる／9人目が警備室へ／暗転／振り返りかける
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
const mini = document.createElement('canvas'); mini.width = W; mini.height = H;
const mctx = mini.getContext('2d');
const frozen = document.createElement('canvas'); frozen.width = W; frozen.height = H;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let plays = parseInt(store.get('f4_plays') || '0', 10) || 0;   // これまでに遊んだ回数（この端末）

/* ===== ノイズ素材（あらかじめ生成） ===== */
const noiseFrames = [];
for (let n = 0; n < 6; n++) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), img = x.createImageData(W, H);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255;
  }
  x.putImageData(img, 0, 0); noiseFrames.push(c);
}

/* ===== 状態 ===== */
let S;
function resetState(){
  S = {
    t: 0, start: 0, running: false, phase: 'corridor',
    anomalies: [],           // {type, t, reported}
    correct: 0, falseReports: 0,
    staticLevel: 0, staticUntil: 0, nextStatic: 6.5,
    lamps: [ {z:2,on:1,fl:0}, {z:4.5,on:1,fl:0}, {z:7,on:1,fl:0}, {z:9.5,on:1,fl:0.6}, {z:12,on:1,fl:0} ],
    figure: { active:false, z:12, x:0, tilt:0 },
    lookedAway: false, hiddenAt: 0,
    fired: new Set(), statusTimer: 0,
    nextStep: 0, nextBreath: 0, ended: false,
    roomAt: 0, ghosts: 0, ghostPhase: false,
    glitch: 0, glitchUntil: 0, glitchPeak: 0, freezeUntil: 0,
    replayFrom: 0, replayUntil: 0, replayAway: 0, hiddenClock: null, awayTotal: 0, awayCount: 0,
    ghostNear: false, roomCrowd: 0, camLabel: 'CAM 03　4F 東廊下',
    subShown: '', subSpan: null, subCorrupt: 0
  };
}
resetState();

/* ===== 異常 ===== */
// 画面に重ねる異常と、床に置かれる物（写真）。物の高さはおよそのメートル
const OVERLAYS = ['door_open', 'light_off', 'shoes', 'handprints', 'exit_red', 'peek', 'time_freeze', 'footprints'];
const OBJECTS = { obj_chair: .85, obj_wheelchair: .95, obj_doll: .42, obj_umbrella: .9, obj_randoseru: .34, obj_balloon: 1.5, obj_box: .45 };
let schedule = [];
function buildSchedule(){
  // 5〜7個。物は多くて3つまで
  const n = Math.max(5, Math.min(7, Math.round((ROOM_AT - 6) / 5.2)));
  const pool = shuffle(OVERLAYS).slice(0, n).concat(shuffle(Object.keys(OBJECTS)).slice(0, 2 + (Math.random() * 2 | 0)));
  const kinds = shuffle(pool).slice(0, n - 2);
  const t0 = 3.5, t1 = ROOM_AT - 4.5, step = (t1 - t0) / n;
  const farAt = 1 + (Math.random() * (n - 3) | 0);   // 遠くの人影が出る順番もランダム
  schedule = [];
  for (let i = 0, k = 0; i < n; i++){
    const t = t0 + step * i + rand(0, step * .55);
    schedule.push({ t, type: i === farAt ? 'figure_far' : i === n - 1 ? 'figure_mid' : kinds[k++] });
  }
}
const active = type => S.anomalies.some(a => a.type === type && !a.reported);
const activeOf = type => S.anomalies.find(a => a.type === type && !a.reported);
function spawn(type){
  const a = { type, t: S.t, reported: false, v: {} };
  // 同じ異常でも、毎回どこに出るかが変わる
  if (type === 'door_open') a.v.door = pick(['leftNear', 'leftFar', 'rightFar', 'rightNear']);
  if (type === 'peek') a.v.door = pick(['leftFar', 'rightFar']);
  if (type === 'light_off') a.v.lamp = pick(['lamp1', 'lamp2', 'lamp3']);
  if (type === 'handprints') Object.assign(a.v, { side: pick([-1, 1]), z0: rand(3.8, 5.5), n: 4 + (Math.random() * 3 | 0) });
  if (type === 'footprints') Object.assign(a.v, { x: rand(-.5, .5), n: 7 + (Math.random() * 5 | 0) });
  if (type === 'shoes') Object.assign(a.v, { x: rand(-.9, .9), z: rand(4.5, 8.5) });
  if (OBJECTS[type]) Object.assign(a.v, { x: rand(-.95, .95), z: rand(4.4, Math.min(10, 4.4 + OBJECTS[type] * 6)), flip: Math.random() < .5 });   // 小さい物ほど手前に
  S.anomalies.push(a);
  if (!S.figure.stuck){
    if (type === 'figure_far') Object.assign(S.figure, { active:true, z:rand(12, 13.5), x:rand(-.6, .6), tilt:0, kind:pick(['girl', 'girl', 'man', 'oldwoman', 'child']) });
    if (type === 'figure_mid') Object.assign(S.figure, { active:true, z:rand(5, 6.5), x:pick([-1, 1]) * rand(.25, .7), tilt:pick([0, .35]), kind:pick(['girl', 'man', 'oldwoman', 'crawl', 'child']) });
  }
  doStatic(0.35, 0.5);
}
function resolve(a){
  a.reported = true;
  setTimeout(() => {
    if (a.type.startsWith('figure') && !S.figure.stuck) S.figure.active = false;
  }, 200);
  doStatic(0.45, 0.8);
}

/* ===== 字幕・タイムライン ===== */
const radio = (s, v) => ({ who:'無線', s, v });
const pad2 = n => String(n).padStart(2, '0');
// 前任者の名前：記録（時刻・見逃し件数・何人目か）からありがちな名前を決め、文字化けさせて出す。
// 名前は入力させないし、どこにも保存しない。同じ記録なら誰の画面でも同じ化け方になる
const SURNAMES = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤', '吉田', '山田', '佐々木', '松本', '井上', '木村', '清水', '林', '斎藤', '山口'];
const GIVEN = ['美咲', '翔太', '陽菜', '大輔', '由美', '健一', '彩', '拓也', '真由美', '直樹', '恵', '和也', '早苗', '誠', '千尋', '浩二'];
function mojibake(text){
  // UTF-8 のバイト列を Shift_JIS として読む（昔ながらの文字化け）
  try { return new TextDecoder('shift_jis').decode(new TextEncoder().encode(text)).replace(/\uFFFD/g, '・'); }
  catch(e){ return Array.from(text, () => '・').join(''); }
}
function recordName(r, n){
  // 記録から決まる乱数（同じ記録なら同じ名前、少し違えば別の名前）
  let h = (r ? r[0] * 3600 + r[1] * 60 + r[2] * 7 : 977) + n * 7919;
  h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h = (h ^ (h >>> 16)) >>> 0;
  return brokenName(SURNAMES[h % SURNAMES.length] + GIVEN[(h >>> 8) % GIVEN.length], h);
}
function realName(r, n){
  let h = (r ? r[0] * 3600 + r[1] * 60 + r[2] * 7 : 977) + n * 7919;
  h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); h = (h ^ (h >>> 16)) >>> 0;
  return SURNAMES[h % SURNAMES.length] + GIVEN[(h >>> 8) % GIVEN.length];
}
// 文字化けの上に、さらに壊れ方を重ねる（同じ名前なら同じ壊れ方）
const GLITCH = ['█', '▓', '▒', '░', '〓', '■', '�', 'ﾞ', 'ﾟ', 'ｷ', 'ﾂ', '繧', '縺', '譁', '蟄', '・'];
const MARKS = ['̶', '̷', '̸', '̴', '̵'];
function seeded(h){ return () => { h = (h + 0x6D2B79F5) >>> 0; let t = Math.imul(h ^ (h >>> 15), 1 | h); t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function brokenName(name, h){
  const rnd = seeded(h), out = [];
  for (const ch of mojibake(name)){
    const x = rnd();
    if (x < .22) out.push(GLITCH[rnd() * GLITCH.length | 0]);           // 置き換わる
    else if (x < .32) out.push(ch, ch, rnd() < .5 ? ch : '');           // 繰り返す
    else out.push(ch);
    if (rnd() < .18) out.push(MARKS[rnd() * MARKS.length | 0]);        // 線が重なる
  }
  const real = Array.from(name);                                       // 元の名前の漢字が1文字もれる
  out.splice(1 + (rnd() * (out.length - 1) | 0), 0, real[rnd() * real.length | 0]);
  return out.join('');
}
const nameSpan = (r, n) => '<span class="mj" data-real="' + realName(r, n) + '">' + recordName(r, n) + '</span>';
function ghostLabel(i, html){
  const r = chain.log[chain.log.length - (CYCLE - 1) + i], n = i + 1;
  return n + '人目　' + (r ? pad2(r[0]) + ':' + pad2(r[1]) + '　見逃し' + r[2] + '件' : '記録なし') + '　' + (html ? nameSpan(r, n) : recordName(r, n));
}
// 場面ごとの言い換え [字幕, 声]。毎回どれか1つを選ぶ
const RADIO_LINES = {
  empty: [['4階は今日、誰もいないはずです。', 'r_empty'], ['4階のテナント、先月で全部退去してます。', 'r_b1'], ['そのフロア、もう電気も止めてあるはずなんですけど。', 'r_b2']],
  saw:   [['……いま、何か映りました？', 'r_saw'], ['……今、そっちで物音、しませんでした？', 'r_c1'], ['……画面、少し暗くなってません？', 'r_c2']],
  noreport: [['報告、一件も届いてないんですけど。', 'r_noreport'], ['報告ボタン、押してます？　こっち、何も来てなくて。', 'r_d1'], ['さっきから、報告が、全部空っぽで届くんです。', 'r_d2']],
  broken: [['4階のカメラ、先月から壊れてるんですよ。', 'r_broken'], ['そのカメラ、配線、切ってあるはずなんですけど。', 'r_e1'], ['4階のカメラは、もう撤去したはずです。', 'r_e2']],
  where: [['じゃあ、今見てるのはどこの映像ですか。', 'r_where'], ['……その映像、どこから来てるんですか。', 'r_f1'], ['じゃあ、あなたは、何を見てるんですか。', 'r_f2']],
  dontturn: [['振り返らないでください。', 'r_dontturn'], ['動かないでください。', 'r_g1'], ['画面から、目を離さないでください。', 'r_g2']],
  arrived: [['交代の人が、もう、そこに。', 'r_arrived'], ['……あなたの後ろの人、誰ですか。', 'r_h1'], ['交代の人、もう着いてますよね。', 'r_h2']],
  extra: [['……すみません、ノイズがひどくて。', 'r_x1'], ['何かあったら、すぐ言ってくださいね。', 'r_x2'], ['前の担当の人も、この時間に連絡が途切れたんです。', 'r_x3']],
};
const line = (key, corrupt) => { const [t, v] = pick(RADIO_LINES[key]); return () => say(radio(t, v), false, corrupt || 0); };

  if (S.ghostPhase){ status('受信者：前任者 ' + S.ghosts + '名', true); return; }
  const open = S.anomalies.filter(a => !a.reported);

const crackCv = $('#crack'), crackCtx = crackCv.getContext('2d');
let cracks = [];
// 割れたガラスの写真（GPT Image 2）。誤報のたびに向き・位置・大きさを変えて1枚ずつ重ねる
const CRACK_IMG = ['a', 'b', 'c'].map(n => { const im = new Image(); im.src = 'img/crack_' + n + '.webp'; return im; });
function addCrack(){
  cracks.push({ i: cracks.length % 3 === 0 ? Math.random() * 3 | 0 : (cracks[cracks.length - 1].i + 1) % 3,
    fx: Math.random() < .5, fy: Math.random() < .5, ox: (Math.random() - .5) * .3, oy: (Math.random() - .5) * .3,
    sc: 1.05 + Math.random() * .35, a: .55 + Math.random() * .2 });
  drawCracks();
}
function drawCracks(){
  const r = crackCv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  crackCv.width = Math.max(1, r.width * dpr | 0); crackCv.height = Math.max(1, r.height * dpr | 0);
  const c = crackCtx, w = crackCv.width, h = crackCv.height;
  c.clearRect(0, 0, w, h);
  for (const k of cracks){
    const im = CRACK_IMG[k.i];
    if (!im.complete || !im.naturalWidth){ im.onload = drawCracks; continue; }
    const cw = w * k.sc, ch = cw * im.naturalHeight / im.naturalWidth;
    c.save(); c.globalAlpha = k.a;
    c.translate(w / 2 + k.ox * w, h / 2 + k.oy * h); c.scale(k.fx ? -1 : 1, k.fy ? -1 : 1);
    c.drawImage(im, -cw / 2, -ch / 2, cw, ch);
    c.restore();
  }
}
addEventListener('resize', () => { if (cracks.length) drawCracks(); });

/* ===== 声：Gemini TTS で事前に作った音声（voice/*.mp3）。目を離した人と9人目では壊していく ===== */
const VOICE_NAMES = ['r_greet','r_again','r_9th','r_empty','r_saw','r_noreport','r_noreport9','r_broken','r_where',
  'r_dontturn','r_arrived','r_nomore','r_youare9','w_away1','w_away2','w_welcome','w_watching','g_kotai0','g_kotai1','g_kotai2','g_kotai3']
  .concat([1, 2, 3, 4, 5, 6, 7, 8].flatMap(n => ['r_pos' + n, 'r_left' + n]))
  .concat(['b1','b2','c1','c2','d1','d2','e1','e2','f1','f2','g1','g2','h1','h2','x1','x2','x3','p3','p4','p5a','p5b','p5c','rp'].map(k => 'r_' + k));
const voiceRaw = {}, voiceBuf = {}, voiceRev = {};
VOICE_NAMES.forEach(n => {   // ページを開いた時点で取得だけしておく（再生はタップ後）
  voiceRaw[n] = fetch('voice/' + n + '.mp3').then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
});
function decodeVoices(){
  if (!AC) return;
  VOICE_NAMES.forEach(n => {
    if (voiceBuf[n]) return;
    voiceRaw[n].then(ab => {
      if (!ab || voiceBuf[n]) return;
      AC.decodeAudioData(ab.slice(0), buf => {
        voiceBuf[n] = buf;
        const r = AC.createBuffer(1, buf.length, buf.sampleRate), src = buf.getChannelData(0), dst = r.getChannelData(0);
        for (let i = 0; i < buf.length; i++) dst[i] = src[buf.length - 1 - i];
        voiceRev[n] = r;
      }, () => {});
    });
  });
}
// どれだけ壊すか（0〜1）。9人目は時間とともに、目を離した人は離すたびに壊れていく
function voiceCorruption(){
  let c = 0;
  if (S.prior >= 2) c = Math.min(.35, (S.prior - 1) * .08);
  if (LAST) c = Math.max(c, Math.min(1, .15 + S.t / 50 * .85));
  if (S.awayCount) c = Math.max(c, Math.min(1, .3 + (S.awayCount - 1) * .25 + Math.max(0, S.t - (S.firstAwayT || 0)) / 40));
  return c;
}
function crushCurve(steps){
  const n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++){ const x = i / (n - 1) * 2 - 1; curve[i] = Math.round(x * steps) / steps; }
  return curve;
}
function playVoice(name, o){
  const buf = voiceBuf[name]; if (!buf || !AC || !master) return;
  o = o || {}; const c = Math.max(0, Math.min(1, o.c || 0));
  const out = AC.createGain(); out.gain.value = (o.gain || 1) * (o.radio ? 1 - c * .5 : 1);   // 歪みで大きくなる分を下げる
  let tail = out;
  if (o.radio){   // 無線っぽく：帯域を狭め、少し歪ませる
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 320;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200 - c * 1600;
    const sh = AC.createWaveShaper(); sh.curve = (() => { const k = new Float32Array(1024); for (let i = 0; i < 1024; i++){ const x = i / 1023 * 2 - 1; k[i] = Math.tanh(x * (1.6 + c * 4)); } return k; })();
    tail.connect(hp); hp.connect(lp); lp.connect(sh); tail = sh;
  }
  if (c > .2){    // 量子化（ビットクラッシュ）
    const cr = AC.createWaveShaper(); cr.curve = crushCurve(Math.max(3, Math.round(40 - c * 36)));
    tail.connect(cr); tail = cr;
  }
  const pan = AC.createStereoPanner ? AC.createStereoPanner() : null;
  if (pan){ pan.pan.value = o.pan || 0; tail.connect(pan); pan.connect(master); } else tail.connect(master);
  const t0 = AC.currentTime + (o.delay || 0);
  if (c < .05){   // 壊さない：そのまま再生
    const s = AC.createBufferSource(); s.buffer = buf; s.connect(out); s.start(t0); return buf.duration + (o.delay || 0);
  }
  // 壊す：細かく刻み、途切れ・繰り返し・逆再生・音程の揺れを混ぜる
  const baseRate = 1 - c * .22;
  let when = t0, pos = 0;
  while (pos < buf.duration - .005){
    const len = Math.min(.06 + Math.random() * .07, buf.duration - pos);
    if (Math.random() < c * .12){ when += len / baseRate * (Math.random() < .5 ? 1 : .3); pos += len; continue; }  // 途切れ
    const reps = Math.random() < c * .28 ? 2 + (Math.random() * (1 + c * 3) | 0) : 1;                                // 繰り返し
    const rev = Math.random() < c * .12;                                                                              // 逆再生
    const rate = baseRate * (Math.random() < c * .3 ? .55 + Math.random() * .75 : 1);                                // 音程の揺れ
    for (let k = 0; k < reps; k++){
      const src = AC.createBufferSource(), g = AC.createGain(), d = len / rate;
      src.buffer = rev ? voiceRev[name] || buf : buf; src.playbackRate.value = rate;
      g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(1, when + .003);
      g.gain.setValueAtTime(1, Math.max(when + .003, when + d - .003)); g.gain.linearRampToValueAtTime(0, when + d);
      src.connect(g); g.connect(out); src.start(when, rev ? Math.max(0, buf.duration - pos - len) : pos, len);
      when += d;
    }
    pos += len;
  }
  if (c > .55){   // 壊れが進むと、1オクターブ下の同じ声が遅れて重なる
    const low = AC.createBufferSource(), g = AC.createGain();
    low.buffer = buf; low.playbackRate.value = .5; g.gain.value = (c - .5) * .9;
    low.connect(g); g.connect(out); low.start(t0 + .08);
  }
  return when - AC.currentTime;
}

// 元画像（1536x1024）の座標 → 画面（320x240）。元画像の中央を 4:3 に切り出している
const PK = 240 / 1024, PX0 = 85;

/* ===== 投影（廊下）：写真の消失点と床の線に合わせてある。単位はおよそメートル ===== */
const CX = 160.7, CY = 68.7, F = 192.4;

const FIG = 1.15;   // 人影は2mを少し超える

function quad(c, pts, fill){

}
const rgb = (r, g, b, k) => `rgb(${r*k|0},${g*k|0},${b*k|0})`;
function lampPower(l, t){

}
function lightAt(z, t){

}
function wallQuad(c, side, z0, z1, y0, y1){

function door(c, side, z0, z1, t, open){

function darkBand(c, z0, z1, a){
  // 奥行き z0〜z1 の床・壁・天井を暗くする（照明が消えたように）。両端はやわらかく
  for (let z = z0; z < z1; z += .25){
    const z2 = Math.min(ZE, z + .26), k = Math.sin((z - z0 + .125) / (z1 - z0) * Math.PI);
    const col = `rgba(0,0,0,${(a * k).toFixed(3)})`;
    quad(c, [P(-XW, YF, z), P(XW, YF, z), P(XW, YF, z2), P(-XW, YF, z2)], col);
    quad(c, [P(-XW, YC, z), P(XW, YC, z), P(XW, YC, z2), P(-XW, YC, z2)], col);
    quad(c, [P(-XW, YC, z), P(-XW, YC, z2), P(-XW, YF, z2), P(-XW, YF, z)], col);
    quad(c, [P(XW, YC, z), P(XW, YC, z2), P(XW, YF, z2), P(XW, YF, z)], col);
  }
}
function fillRectPair(c, pair, fill){ const [a, b] = pair; c.fillStyle = fill; c.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]); }
/* ===== 人影 ===== */
function drawFigure(c, bx, by, s, o){
  // bx,by: 足元のスクリーン座標, s: 1単位あたりのpx, o: {tilt, lean, alpha}
  const lean = o.lean || 0, tilt = o.tilt || 0;
  c.save(); c.translate(bx, by); c.scale(s, s);
  c.fillStyle = c.strokeStyle = o.color || '#050505';
  c.lineCap = 'round'; c.lineJoin = 'round';
  // 脚
  c.lineWidth = .085;
  for (const sx of [-1, 1]){ c.beginPath(); c.moveTo(sx * .075, -0.92); c.lineTo(sx * .065, 0); c.stroke(); }
  // 上半身（腰から傾く）
  c.translate(0, -0.92); c.rotate(-lean);
  c.beginPath(); c.moveTo(-.15, 0); c.lineTo(.15, 0); c.lineTo(.2, -.5); c.lineTo(-.2, -.5); c.closePath(); c.fill();
  c.beginPath(); c.ellipse(0, -.5, .2, .055, 0, 0, Math.PI * 2); c.fill();
  // 長すぎる腕
  c.lineWidth = .065;
  for (const sx of [-1, 1]){
    // 腕は体が傾いても真下へ垂れる
    c.save(); c.translate(sx * .19, -.47); c.rotate(lean);
    c.beginPath(); c.moveTo(0, 0); c.lineTo(sx * .04, .85); c.stroke();
    c.lineWidth = .05; c.beginPath(); c.moveTo(sx * .04, .85); c.lineTo(sx * .045, .97); c.stroke();
    c.restore();
  }
  // 首と頭
  c.lineWidth = .065; c.beginPath(); c.moveTo(0, -.52); c.lineTo(0, -.62); c.stroke();
  c.translate(0, -.62); c.rotate(tilt);
  c.beginPath(); c.ellipse(0, -.11, .088, .12, 0, 0, Math.PI * 2); c.fill();
  // 垂れ下がる長い髪（常に真下へ）
  c.rotate(-tilt + lean);
  c.beginPath(); c.moveTo(-.1, -.12); c.quadraticCurveTo(-.15, .15, -.12, .42); c.lineTo(.12, .42); c.quadraticCurveTo(.15, .15, .1, -.12); c.closePath(); c.fill();
  c.restore();
}

/* ===== 人物の写真（GPT Image 2 で作った切り抜き）。読めなければ影の図形で描く ===== */
const SPR = {};
['fig_stand', 'fig_tilt', 'fig_lean', 'fig_walk1', 'fig_walk2', 'fig_man', 'fig_oldwoman', 'fig_child', 'fig_crawl',
 'guard_a', 'guard_b', 'guard_c', 'guard_d'].concat(Object.keys(OBJECTS)).forEach(n => {
  const im = new Image(); SPR[n] = { el: im, ok: false };
  im.onload = () => { SPR[n].ok = true; }; im.src = 'img/' + n + '.webp';
});
const sprTmp = document.createElement('canvas'), sprCtx = sprTmp.getContext('2d');
// bx,by: 足元, h: 画面上の身長(px), o.dark: 暗さ 0〜1, o.flip: 左右反転, o.alpha
function drawSprite(c, name, bx, by, h, o){
  const sp = SPR[name]; if (!sp || !sp.ok || h < 1) return false;
  o = o || {};
  const im = sp.el, w = h * im.width / im.height;
  const tw = Math.max(1, Math.ceil(w)), th = Math.max(1, Math.ceil(h));
  sprTmp.width = tw; sprTmp.height = th;
  sprCtx.globalCompositeOperation = 'source-over';
  sprCtx.save();
  if (o.flip){ sprCtx.translate(tw, 0); sprCtx.scale(-1, 1); }
  sprCtx.drawImage(im, 0, 0, tw, th);
  sprCtx.restore();
  if (o.dark > .01){   // 人物の形のまま暗くする（暗がりに立っているように）
    sprCtx.globalCompositeOperation = 'source-atop';
    sprCtx.fillStyle = `rgba(4,5,4,${Math.min(.95, o.dark)})`; sprCtx.fillRect(0, 0, tw, th);
  }
  const a = c.globalAlpha; c.globalAlpha = a * (o.alpha == null ? 1 : o.alpha);
  c.drawImage(sprTmp, bx - w / 2, by - h, w, h);
  c.globalAlpha = a;
  return true;
}
const farDark = z => Math.min(.75, .18 + Math.max(0, z - 2.5) * .05);   // 遠いほど暗い
// 「それ」の種類。h: 身長(m)、speed: 近づく速さの倍率（0は動かない）
const KINDS = {
  girl:     { h: 1.77 * FIG, speed: 1 },
  man:      { h: 2.15, speed: .8, sprite: 'fig_man' },
  oldwoman: { h: 1.4, speed: .5, sprite: 'fig_oldwoman' },

  crawl:    { h: .85, speed: .45, sprite: 'fig_crawl' },     // 四つんばいで這ってくる
};
// 歩いているときは足を交互に出し、体が少し上下する
function drawWalker(c, kind, bx, by, h, t, moving, o){
  const K = KINDS[kind] || KINDS.girl;
  let name = K.sprite || (o.tilt > .3 ? 'fig_tilt' : 'fig_stand'), y = by;
  if (moving){
    const ph = t * 3.2 + (o.seed || 0);
    if (kind === 'girl' || !K.sprite) name = ['fig_walk1', 'fig_stand', 'fig_walk2', 'fig_stand'][Math.floor(ph) % 4];
    if (kind !== 'crawl') y -= Math.abs(Math.sin(ph * Math.PI / 2)) * h * .012;
    else bx += Math.sin(ph * 1.6) * h * .03;
  }
  if (!SPR[name] || !SPR[name].ok) name = 'fig_stand';
  return drawSprite(c, name, bx, y, h, o);
}

  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);

    quad(c, [P(XW, YC, z0), P(XW, YC, z1 + .01), P(XW, YF, z1 + .01), P(XW, YF, z0)], rgb(70, 72, 67, L * .92)); // 右壁
  }

  const Le = lightAt(ZE, t);
  quad(c, [P(-XW, YC, ZE), P(XW, YC, ZE), P(XW, YF, ZE), P(-XW, YF, ZE)], rgb(66, 68, 63, Le));

let AC, master, drone, droneFilter, white, brown;
function makeNoise(type){
  const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    if (type === 'brown'){ last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
  }

}
function loop(buf){ const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; s.start(); return s; }
function initAudio(){
  if (!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
    white = makeNoise('white'); brown = makeNoise('brown');
  }
  AC.resume && AC.resume();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  master.gain.linearRampToValueAtTime(.9, AC.currentTime + 1);
  // 換気扇：こもった「ゴーッ」と、羽根が回るゆるい唸り。BGMはなし
  const fan = loop(brown), lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
  const pk = AC.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 140; pk.Q.value = 1.2; pk.gain.value = 6;
  const fg = AC.createGain(); fg.gain.value = .06; fan.connect(lp); lp.connect(pk); pk.connect(fg); fg.connect(master);
  const motor = AC.createOscillator(); motor.frequency.value = 47;
  const mg = AC.createGain(); mg.gain.value = .004; motor.connect(mg); mg.connect(master); motor.start();
  const wob = AC.createOscillator(); wob.frequency.value = .35;
  const wg = AC.createGain(); wg.gain.value = .014; wob.connect(wg); wg.connect(fg.gain); wob.start();   // 風量がわずかに揺れる

  const g = AC.createGain(), t0 = when || AC.currentTime;

  node.connect(g); return g;
}
function staticNoise(dur, lvl){

function frame(now){

  }

  const fg = S.figure;
  if (fg.stuck) fg.tilt = Math.min(.95, fg.tilt + .0006);
  else if (fg.active && S.phase === 'corridor'){ const sp = (KINDS[fg.kind] || KINDS.girl).speed; fg.moving = sp > 0 && fg.z > 3.02; fg.z = Math.max(3, fg.z - .035 * sp); fg.tilt += (Math.sin(t * .4) * .05 - fg.tilt * .002) * .02; }
  // 足音・呼吸
  if (t > S.nextStep){
    if (S.phase === 'corridor' && fg.active && fg.moving){ footstep(.05 * (6 / fg.z), .2); S.nextStep = t + .9 + Math.random() * .5; }
    else if (S.phase === 'room' && !LAST && t < ROOM_AT + 7){ footstep(.06 + (t - ROOM_AT) * .01, -.3); S.nextStep = t + 1.2; }
    else S.nextStep = t + 1;
  }
  if (S.phase === 'room' && t > S.roomAt + 3 && t > S.nextBreath && t < END_AT){
    if (LAST && S.roomCrowd){ breath(.05, Math.random() * 1.6 - .8); S.nextBreath = t + .7 + Math.random() * .5; }  // 何人もの息
    else { breath(.04 + (t - S.roomAt) * .005); S.nextBreath = t + 2.8; }
  }

  const replaying = S.phase === 'corridor' && t >= S.replayFrom && t < S.replayUntil;
  if (t < S.freezeUntil){   // 映像が止まる：止まった瞬間の画を保ったまま乱す
    if (!S.frozen){ frozen.getContext('2d').drawImage(cv, 0, 0); S.frozen = true; }
    ctx.drawImage(frozen, 0, 0); glitchFx(ctx, S.glitch * .7);
  }
  else if (S.phase === 'corridor'){
    S.frozen = false;
    if (replaying){
      // 録画の再生：人影が奥からカメラの真下まで歩いてくる
      const keep = Object.assign({}, fg), q = ease((t - S.replayFrom) / 4.4);
      Object.assign(S.figure, { active: true, z: 12 - 10.4 * q, x: .15 * q, tilt: .55 * q, kind: 'girl', moving: q < 1 });
      drawCorridor(ctx, t); Object.assign(S.figure, keep);
    } else drawCorridor(ctx, t);
    post(ctx, t);
  } else { S.frozen = false; drawRoom(ctx, t); post(ctx, t); }
  // 画面の揺れ・表示の文字化け
  $('#monitor').style.transform = S.glitch > .05 ? `translate(${(Math.random() - .5) * 8 * S.glitch}px,${(Math.random() - .5) * 5 * S.glitch}px)` : '';
  let cam = replaying ? 'CAM 03　▶ 再生中（不在時の録画）' : S.camLabel;
  if (LAST && S.phase === 'corridor' && t % 5.3 < .18) cam = 'CAM 09　4F 東廊下';
  $('#osd-cam').textContent = S.glitch > .35 ? garble(cam, S.glitch) : cam;
  const g2 = Math.max(S.glitch > .3 ? S.glitch : 0, S.subCorrupt);
  if (S.subSpan) S.subSpan.textContent = g2 > 0 ? garble(S.subShown, g2) : S.subShown;
  $('#osd-time').textContent = S.glitch > .5 ? garble(stamp(), S.glitch) : stamp();
  $('#osd-rec').style.visibility = (t % 1.4) < .9 ? 'visible' : 'hidden';
  if (!S.ended) requestAnimationFrame(frame);
}

/* ===== 開始・終了 ===== */
function startGame(){
  resetState(); buildRun(); S.roomAt = LAST ? LAST_ROOM_AT : ROOM_AT;
  plays++; store.set('f4_plays', String(plays));
  $('#title').classList.add('hidden'); $('#ending').classList.add('hidden');
  const g = $('#game'); g.classList.remove('hidden'); g.removeAttribute('aria-hidden');
  $('#fade').style.transition = 'none'; $('#fade').style.opacity = 0; $('#fade').innerHTML = ''; $('#monitor').style.transform = '';
  $('#osd-cam').textContent = 'CAM 03　4F 東廊下'; $('#sub').innerHTML = '';
  $('#report').disabled = false;
  cracks = []; drawCracks();
  initAudio(); decodeVoices(); primeVoice(); pickVoice();
  S.running = true; S.start = performance.now();
  requestAnimationFrame(frame);
}
function endSequence(){
  if (TTS) try { TTS.cancel(); } catch(e){}
  if (LAST){
    // 9人目：信号が途切れて、音も消える
    const f = $('#fade'); f.style.transition = 'none'; f.style.opacity = 1; f.innerHTML = '<span class="nosig">信号なし</span>';
    $('#report').disabled = true; say(null); $('#monitor').style.transform = '';
    if (AC && master){ master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(0, AC.currentTime); }
    setTimeout(showEnding, 2600);
    return;
  }
  $('#fade').style.transition = 'opacity 2.5s'; $('#fade').style.opacity = 1;
  $('#report').disabled = true; say(null);
  if (AC && master){ master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(master.gain.value, AC.currentTime); master.gain.linearRampToValueAtTime(0, AC.currentTime + 3); }
  setTimeout(showEnding, 2800);
}
function showEnding(){
  S.ended = true; S.running = false;
  $('#game').classList.add('hidden');
  const missed = S.anomalies.filter(a => !a.reported).length;
  const total = S.anomalies.length;
  $('#end-stat').textContent = `異常 ${total}件 ／ 報告 ${total - missed}件 ／ 見逃し ${missed}件` + (S.falseReports ? ` ／ 誤報 ${S.falseReports}件` : '');
  let text;
  if (LAST) text = 'あなたの前に、8人いました。';
  else if (S.lookedAway) text = 'あなたは ' + S.awayTotal.toFixed(1) + '秒、目を離しました。<br>そのあいだ、それはずっとあなたを見ていました。';
  else if (S.falseReports >= 3) text = 'モニターは、ひび割れて使えなくなりました。<br>次の人は、何も見えないまま座ることになります。';
  else if (missed === 0) text = 'すべて報告しました。<br>でも、届いた報告は一件もありませんでした。';
  else text = '見逃したものは、まだ4階に残っています。<br>次の人が、見つけてくれるかもしれません。';
  $('#end-text').innerHTML = text;
  // 引き継ぎ記録
  const now = new Date();
  const mine = [now.getHours(), now.getMinutes(), missed];
  const logEl = $('#end-log');
  if (LAST){
    $('#end-head').textContent = '04:44　交代は、来ませんでした。';
    logEl.hidden = false;
    logEl.innerHTML = Array.from({ length: CYCLE - 1 }, (_, i) => ghostLabel(i, true)).join('<br>') +
      '<br><span class="me">' + CYCLE + '人目　' + pad2(mine[0]) + ':' + pad2(mine[1]) + '　あなた</span>';
    $('#end-chain').textContent = 'あなたが、9人目です。';
    $('#end-hand').textContent = '次の人からは、また1人目に戻ります。';
    $('#share-x').textContent = '「9人目だった」と伝える';
  } else {
    $('#end-head').textContent = '04:44　交代しました。';
    const prev = chain.log.slice(-(POS - 1)), first = POS - prev.length;
    const rows = [];
    for (let n = 1; n < first; n++) rows.push(n + '人目　記録なし　' + nameSpan(null, n));
    prev.forEach((r, i) => rows.push((first + i) + '人目　' + pad2(r[0]) + ':' + pad2(r[1]) + '　見逃し' + r[2] + '件　' + nameSpan(r, first + i)));
    rows.push('<span class="me">' + POS + '人目　' + pad2(mine[0]) + ':' + pad2(mine[1]) + '　あなた</span>');
    for (let n = POS + 1; n <= CYCLE; n++) rows.push(n + '人目　――');
    logEl.hidden = false; logEl.innerHTML = rows.join('<br>');
    $('#end-chain').innerHTML = 'あなたは ' + POS + '人目の担当者です。<br>9人目の担当者には、交代が来ません。　あと ' + (CYCLE - POS) + '人。';
    $('#end-hand').textContent = 'このモニターは、次の人に引き継いでください。';
    $('#share-x').textContent = 'Xで引き継ぐ';
  }
  flickerNames();
  const base = location.href.split('#')[0].split('?')[0];
  const url = base + '?k=' + encChain({ n: chain.n + 1, log: LAST ? [] : chain.log.concat([mine]).slice(-(CYCLE - 1)) });
  const msg = LAST
    ? `深夜の警備バイト。\n私が9人目だった。\n交代は、来なかった。\n\n次の人から、また1人目。\n「4階、異常なし。」`
    : `深夜の警備バイト。見逃した異常：${missed}件。\n私は${POS}人目。9人目まで、あと${CYCLE - POS}人。\n次の人に引き継ぎます。\n\n「4階、異常なし。」`;
  $('#share-x').href = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(url) + '&hashtags=' + encodeURIComponent('4階異常なし');
  if (navigator.share){ const b = $('#share-native'); b.hidden = false; b.onclick = () => navigator.share({ title:'4階、異常なし。', text: msg, url }).catch(() => {}); }
  $('#share-copy').onclick = () => {
    const done = () => { $('#toast').textContent = 'リンクをコピーしました。'; };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done)); else fallbackCopy(url, done);
  };
  const end = $('#ending'); end.classList.remove('hidden');
  end.querySelectorAll('.line').forEach(el => { el.classList.remove('on'); setTimeout(() => el.classList.add('on'), +el.dataset.d + 400); });
  document.title = '4階、異常なし。';
}
let flickerTimer;
function flickerNames(){
  clearInterval(flickerTimer);
  const spans = [...document.querySelectorAll('#end-log .mj')];
  spans.forEach(sp => sp.dataset.base = sp.textContent);
  if (!spans.length) return;
  flickerTimer = setInterval(() => {
    if ($('#ending').classList.contains('hidden')){ clearInterval(flickerTimer); return; }
    for (let m = 0; m < 1 + (Math.random() * 2 | 0); m++){
      const sp = spans[Math.random() * spans.length | 0], base = sp.dataset.base, x = Math.random();
      if (x < .07) sp.textContent = sp.dataset.real;                     // 一瞬だけ、本当の名前
      else if (x < .25) sp.textContent = Array.from(base, () => GLITCH[Math.random() * GLITCH.length | 0]).join('');
      else {
        const chars = Array.from(base);
        for (let k = 0; k < 1 + (Math.random() * 3 | 0); k++) chars[Math.random() * chars.length | 0] = GLITCH[Math.random() * GLITCH.length | 0];
        sp.textContent = chars.join('');
      }
      setTimeout(() => { sp.textContent = base; }, x < .07 ? 140 : 90 + Math.random() * 160);
    }
  }, 260);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  ta.remove();
}
$('#badge').textContent = '引き継ぎ No.' + String(chain.n).padStart(4, '0');
$('#start').addEventListener('click', startGame);
$('#again').addEventListener('click', startGame);
